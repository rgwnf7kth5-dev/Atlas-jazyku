# Netlify si stránku při každém pushi do main sestaví sám.
# Když validace dat najde chybu, sestavení selže a na webu zůstane poslední dobrá verze.
[build]
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Dvě domény, jeden web ----
# atlasjazyku.cz = česká verze (kořen dist/), thelanguageatlas.com = anglická verze (dist/en/ servírovaná z kořene).
# Rozhoduje edge funkce netlify/edge-functions/domeny.js. Pravidla s doménou ve „from“ tady Netlify u tohoto
# webu nepoužíval (25. 9. 2026 vracela anglická doména českou stránku), proto tu nejsou.

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
