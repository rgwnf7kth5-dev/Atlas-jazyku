<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
 <symbol id="i-hvezda" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.6l2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 16.8 6.4 19.9l1.2-6.3L3 9.2l6.3-.8z"/></symbol>
 <symbol id="i-slunce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></symbol>
 <symbol id="i-mesic" viewBox="0 0 24 24"><path fill="currentColor" d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3a8.6 8.6 0 1 0 11.3 11.3z"/></symbol>
 <symbol id="i-dopis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.6"/><path d="M4 7.5l8 5.8 8-5.8" stroke-linecap="round"/></symbol>
 <symbol id="i-kostka" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="4.4"/><circle cx="8.4" cy="8.4" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.6" cy="15.6" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.6" cy="8.4" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.4" cy="15.6" r="1.4" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-svet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8c2.6 2.6 3.9 6 3.9 9.2s-1.3 6.6-3.9 9.2c-2.6-2.6-3.9-6-3.9-9.2S9.4 5.4 12 2.8z"/></symbol>
 <symbol id="i-zvuk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 9.2h3.4L12 5v14l-4.6-4.2H4z" fill="currentColor"/><path d="M16 9.4a3.7 3.7 0 0 1 0 5.2M18.7 6.7a7.5 7.5 0 0 1 0 10.6" stroke-linecap="round"/></symbol>
 <symbol id="i-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6.6"/><path d="M15.4 15.4L21 21"/></symbol>
 <symbol id="i-otacet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></symbol>
 <symbol id="i-jmena" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.2V5.5a2 2 0 0 1 2-2h6.7l8.3 8.3a2 2 0 0 1 0 2.8l-5.9 5.9a2 2 0 0 1-2.8 0z"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></symbol>
 <symbol id="i-krizek" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></symbol>
</svg>

<canvas id="hvezdy" aria-hidden="true"></canvas>
<div class="app">
 <header class="hlava sklo">
  <svg class="znak" viewBox="0 0 48 48" aria-hidden="true">
   <defs>
    <radialGradient id="znak-koule" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#17306E"/><stop offset="1" stop-color="#030614"/></radialGradient>
    <linearGradient id="znak-prsten" x1="0" x2="1"><stop offset="0" stop-color="#35D6FF"/><stop offset="1" stop-color="#B26BFF"/></linearGradient>
   </defs>
   <circle cx="24" cy="24" r="21" fill="none" stroke="#35D6FF" stroke-opacity=".18" stroke-width="3"/>
   <circle cx="24" cy="24" r="16" fill="url(#znak-koule)" stroke="#7FE9FF" stroke-opacity=".75" stroke-width="1.2"/>
   <g fill="#5ADCFF"><circle cx="18" cy="17" r="1.3"/><circle cx="23" cy="15" r="1"/><circle cx="28" cy="19" r="1.3"/><circle cx="20" cy="23" r="1"/><circle cx="31" cy="26" r="1"/><circle cx="17" cy="30" r="1.1"/><circle cx="26" cy="32" r="1"/></g>
   <circle cx="25" cy="24" r="2.3" fill="#FFD45E"/>
   <path d="M25 24Q30 16 28 19M25 24Q22 28 17 30" fill="none" stroke="#B26BFF" stroke-width="1" stroke-linecap="round"/>
   <ellipse cx="24" cy="24" rx="23" ry="6.5" transform="rotate(-22 24 24)" fill="none" stroke="url(#znak-prsten)" stroke-width="1.5"/>
  </svg>
  <div class="nadpisy">
   <h1 data-t="nazev">{{nazev}}</h1>
   <p class="podnadpis" data-t="podnadpis">{{podnadpis}}</p>
  </div>
  <p class="sbirka" title="{{sbirkaTitulek}}" data-t-title="sbirkaTitulek"><svg aria-hidden="true"><use href="#i-hvezda"/></svg><span id="sbirka-text"></span></p>
  <a class="jazyk-prepinac" id="jazyk-prepinac" href="{{odkazJinam}}" hreflang="{{jinyKod}}" lang="{{jinyKod}}" title="{{jinyJazykPopis}}" data-t="jinyJazyk" data-t-title="jinyJazykPopis">{{jinyJazyk}}</a>
  <button class="prepinac" id="prepinac" type="button" aria-pressed="false" aria-label="{{motiv}}" title="{{motiv}}" data-t-aria-label="motiv" data-t-title="motiv">
   <svg aria-hidden="true"><use href="#i-slunce" id="ikona-rezim"/></svg>
  </button>
 </header>

 <div class="mriz">
  <section class="scena" id="scena" aria-label="{{scena}}" data-t-aria-label="scena">
   <div class="globus-misto" aria-hidden="true"></div>
   <canvas id="podklad" aria-hidden="true"></canvas>
   <canvas id="gl" aria-hidden="true"></canvas>
   <canvas id="popisky" aria-hidden="true"></canvas>
   <canvas id="globus" role="img" aria-label="{{platno}}" data-t-aria-label="platno"></canvas>
   <div class="hud" id="hud" aria-hidden="true"><span class="souradnice" id="hud-souradnice"></span><span class="stav-hud" id="hud-stav"></span></div>
   <div class="ovladani">
    <button class="tl hlavni" id="tl-nahoda" type="button"><svg aria-hidden="true"><use href="#i-kostka"/></svg><span data-t="prekvap">{{prekvap}}</span></button>
    <button class="tl" id="tl-cely" type="button" hidden><svg aria-hidden="true"><use href="#i-svet"/></svg><span data-t="celySvet">{{celySvet}}</span></button>
    <div class="volby">
     <button class="tl volba otacet" id="tl-otacet" type="button" aria-pressed="false" title="{{otacetPopis}}" data-t-title="otacetPopis"><svg aria-hidden="true"><use href="#i-otacet"/></svg><span data-t="otacet">{{otacet}}</span></button>
     <button class="tl volba" id="tl-jmena" type="button" aria-pressed="true" title="{{jmenaPopis}}" data-t-title="jmenaPopis"><svg aria-hidden="true"><use href="#i-jmena"/></svg><span data-t="jmena">{{jmena}}</span></button>
    </div>
    <div class="zoom-ovl" role="group" aria-label="{{zoomSkupina}}" data-t-aria-label="zoomSkupina">
     <button class="kolo" id="tl-oddal" type="button" aria-label="{{oddalit}}" data-t-aria-label="oddalit"><svg aria-hidden="true"><use href="#i-minus"/></svg></button>
     <span class="zoom-hod" id="zoom-hod">1,0&times;</span>
     <button class="kolo" id="tl-priblizi" type="button" aria-label="{{priblizit}}" data-t-aria-label="priblizit"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
    </div>
   </div>
   <p class="napoveda" id="napoveda">{{napovedaStart}}</p>
   <div class="zeme-okno sklo" id="zeme-okno" hidden></div>
   <div class="bublina-bod" id="bublina-bod" hidden></div>
   <div class="vypadek" id="vypadek" hidden>
    <strong data-t="vypadekNadpis">{{vypadekNadpis}}</strong>
    <span data-t="vypadekText">{{vypadekText}}</span>
   </div>
   <p class="legenda" id="legenda"><i></i><span data-t="legenda">{{legenda}}</span></p>

   <article class="karta sklo" id="karta" hidden aria-live="polite">
    <div class="karta-hlava">
     <div>
      <p class="kod" id="k-kod"></p>
      <h2 id="k-nazev"></h2>
      <p class="domaci" id="k-domaci"></p>
      <span class="odznak" id="k-odznak" hidden></span>
     </div>
     <button class="zavrit" id="k-zavrit" type="button" aria-label="{{zavritKartu}}" data-t-aria-label="zavritKartu"><svg aria-hidden="true"><use href="#i-krizek"/></svg></button>
    </div>
    <p class="rejstrik-pozn" id="k-pozn" hidden></p>
    <div class="podrobnosti" id="k-podrobnosti" hidden></div>
    <div id="k-plne">
     <div class="bublina" id="k-bublina">
      <p class="pozdrav" id="k-pozdrav"></p>
      <p class="prepis" id="k-prepis"></p>
      <button class="prehraj" id="k-prehraj" type="button"><svg aria-hidden="true"><use href="#i-zvuk"/></svg><span>{{poslechni}}</span></button>
      <p class="stav" id="k-stav" hidden></p>
     </div>
     <dl class="udaje">
      <div class="udaj"><dt data-t="mluvcich">{{mluvcich}}</dt><dd id="k-mluvcich"></dd></div>
      <div class="udaj"><dt data-t="rodina">{{rodina}}</dt><dd id="k-rodina" class="rodina-txt"></dd></div>
     </dl>
     <p class="fakt"><b data-t="vis">{{vis}}</b><span id="k-fakt"></span></p>
     <div class="podrobnosti" id="k-pribuzni" hidden></div>
    </div>
    <div class="kde" id="k-kde"><span data-t="kdeMluvi">{{kdeMluvi}}</span><ul class="staty" id="k-staty"></ul></div>
   </article>
  </section>

  <aside class="police sklo" aria-label="{{seznam}}" data-t-aria-label="seznam">
   <div class="hledani">
    <label class="pole">
     <svg aria-hidden="true"><use href="#i-lupa"/></svg>
     <input id="hledej" type="search" placeholder="{{hledejPlaceholder}}" aria-label="{{hledejPopisek}}" data-t-placeholder="hledejPlaceholder" data-t-aria-label="hledejPopisek">
    </label>
    <p class="pocet" id="pocet"></p>
   </div>
   <div class="seznam" id="seznam"></div>
   <p class="zpetna"><svg aria-hidden="true"><use href="#i-dopis"/></svg><span><span data-t="zpetna">{{zpetna}}</span>
    <a id="zpetna-odkaz" href="mailto:{{zpetnaAdresa}}" title="{{zpetnaPopis}}" data-t-title="zpetnaPopis">{{zpetnaAdresa}}</a></span></p>
   <p class="zdroje" data-t="zdroje">{{zdroje}}</p>
  </aside>
 </div>
</div>
