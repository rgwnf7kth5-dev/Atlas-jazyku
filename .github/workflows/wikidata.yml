# Jednou měsíčně stáhne z Wikidat počty mluvčích, české názvy a odkazy na Wikipedii,
# obnoví podrobnosti k tečkám (i z Glottologu, WALS, PHOIBLE, UDHR, CLDR) a navrhne změny jako pull request.
# PR obsahuje jen oba datové výstupy; dist/ z kontroly se necommituje.
# Ručně: záložka Actions → „Data z Wikidat“ → Run workflow.
name: Data z Wikidat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"      # 1. den v měsíci v 4:17 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wikidata
  cancel-in-progress: false

jobs:
  wikidata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # I ruční běh ze starší větve musí vycházet z aktuálního mainu.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stáhnout data z Wikidat
        run: node scripts/wikidata.mjs

      - name: Přepočítat podrobnosti k tečkám
        run: node scripts/podrobnosti.mjs

      - name: Kontrola a sestavení
        run: npm run check

      - name: Navrhnout změny jako pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wikidata-pr.sh
