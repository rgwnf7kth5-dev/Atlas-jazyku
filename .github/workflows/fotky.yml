# Stáhne fotky na pohlednice jazyků z Wikimedia Commons (výběr přes Wikidata, viz scripts/fotky.mjs).
# Ručně: Actions → „Fotky na pohlednice“ → Run workflow. Na větvi redesign-encyklopedie se spustí i po změně skriptu nebo oprav.
# Na main navrhne změny jako pull request, na jiné větvi je rovnou přidá do ní.
name: Fotky na pohlednice

on:
  workflow_dispatch:
    inputs:
      znovu:
        description: "Stáhnout všechny fotky znovu"
        type: boolean
        default: false
  push:
    branches: [redesign-encyklopedie]
    paths: [scripts/fotky.mjs, scripts/fotky-kandidati.mjs, scripts/fotky-listy.py, data/fotky-opravy.json, .github/workflows/fotky.yml]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fotky-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fotky:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Najít kandidáty (kvalitní fotky míst)
        run: node scripts/fotky-kandidati.mjs ${{ inputs.znovu && '--znovu' || '' }}

      - name: Stáhnout vybrané fotky
        run: node scripts/fotky.mjs ${{ inputs.znovu && '--znovu' || '' }}

      - name: Přehledové listy pro výběr
        if: github.ref_name != 'main'
        run: pip install --quiet pillow && python3 scripts/fotky-listy.py

      - name: Přehled vybraných fotek
        run: cat data/fotky-hlaseni.md >> "$GITHUB_STEP_SUMMARY"

      - name: Kontrola a sestavení
        run: npm run check

      - name: Uložit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data static dist .nahledy-fotek && [ -z "$(git ls-files --others --exclude-standard data static dist .nahledy-fotek)" ]; then
            echo "Fotky se od minula nezměnily."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DNES=$(date -u +%Y-%m-%d)
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            git add -A data static dist .nahledy-fotek
            git commit -m "Fotky na pohlednice z Wikimedia Commons ($DNES)"
            git push origin "HEAD:$GITHUB_REF_NAME"
            exit 0
          fi
          VETEV="data/fotky-$DNES-$GITHUB_RUN_ID"
          git switch -c "$VETEV"
          git add data static dist
          git commit -m "Fotky na pohlednice z Wikimedia Commons ($DNES)"
          git push -u origin "$VETEV"
          gh pr create --base main --head "$VETEV" --title "Fotky na pohlednice ($DNES)" --body-file data/fotky-hlaseni.md
