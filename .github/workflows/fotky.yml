# Stáhne kandidátní fotky z Wikimedia Commons i s autorem a licencí (data/fotky-hledat.json)
# a uloží je na samostatnou větev foto-kandidati, odkud se vyberou ty, které půjdou na web.
# Spouští se samo po změně zadání, nebo ručně: Actions → „Fotky z Commons“ → Run workflow.
name: Fotky z Commons

on:
  workflow_dispatch:
  push:
    paths:
      - data/fotky-hledat.json
      - scripts/fotky.mjs
      - .github/workflows/fotky.yml

permissions:
  contents: write

concurrency:
  group: fotky
  cancel-in-progress: true

jobs:
  fotky:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stáhnout kandidáty
        run: node scripts/fotky.mjs
      - name: Uložit na větev foto-kandidati
        run: |
          cd kandidati
          git init -q -b foto-kandidati
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Kandidátní fotky z Commons (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" foto-kandidati
