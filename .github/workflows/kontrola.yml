# Při každém pushi a pull requestu ověří datový PR, zkontroluje data a sestaví všechny jazykové verze.
name: Kontrola

on:
  push:
  pull_request:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regresní test datového PR
        run: node --test scripts/wikidata-pr.test.mjs
      - run: npm run check
