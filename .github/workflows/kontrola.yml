# Při každém pushi a pull requestu zkontroluje data a sestaví obě jazykové verze.
name: Kontrola

on:
  push:
  pull_request:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
