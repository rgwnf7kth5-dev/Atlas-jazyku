# Dočasné: stáhne stránky dokumentace Netlify o certifikátech (z prostředí Claude Code jsou blokované).
name: Dokumentace Netlify
on: workflow_dispatch
jobs:
  stahni:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://docs.netlify.com/manage/domains/secure-domains-with-https/https-ssl/ https://docs.netlify.com/domains-https/https-ssl/ https://docs.netlify.com/manage/domains/configure-domains/configure-external-dns/ https://docs.netlify.com/manage/domains/get-started-with-domains/; do
            echo "=================== $u"
            curl -sSL -m 40 "$u" | python3 -c "
          import sys, html.parser, re
          class P(html.parser.HTMLParser):
              def __init__(s): super().__init__(); s.t=[]; s.skip=0
              def handle_starttag(s,tag,a):
                  if tag in ('script','style','nav','header','footer'): s.skip+=1
                  if tag in ('p','li','h1','h2','h3','h4','br','tr'): s.t.append('\n')
              def handle_endtag(s,tag):
                  if tag in ('script','style','nav','header','footer'): s.skip-=1
              def handle_data(s,d):
                  if s.skip<=0: s.t.append(d)
          p=P(); p.feed(sys.stdin.read()); print(re.sub(r'\n\s*\n+','\n',''.join(p.t)))
          " | grep -iE -B2 -A6 "renew|provision|certificate|verify dns|HTTPS|awaiting|Domain management|Domains" | head -250
          done
