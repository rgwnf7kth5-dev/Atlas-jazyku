# Dočasné: stáhne stránky dokumentace Netlify o certifikátech (z prostředí Claude Code jsou blokované).
name: Dokumentace Netlify
on: workflow_dispatch
jobs:
  stahni:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sSL -m 40 https://docs.netlify.com/llms.txt > llms.txt
          grep -iE "troubleshoot|https|ssl|certificate" llms.txt | head -30
          for u in $(grep -oE 'https://docs\.netlify\.com[^ )]*' llms.txt | grep -iE "troubleshoot.*(ssl|https|domain)|ssl.*troubleshoot|https.*troubleshoot|domains/troubleshoot" | sort -u | head -4); do
            md="${u%/}.md"; [[ "$u" == *.md ]] && md="$u"
            echo "=================== $md"
            curl -sSL -m 40 "$md" | grep -iE -B3 -A10 "renew|provision|verify dns|awaiting|pending|Domain management" | head -150
          done
