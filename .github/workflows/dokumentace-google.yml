# Dočasné: stáhne nápovědu Google Search Console (z prostředí Claude Code je blokovaná).
name: Dokumentace Google
on: workflow_dispatch
jobs:
  stahni:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for id in 34592 9008080 7451001 9012289; do
            u="https://support.google.com/webmasters/answer/$id?hl=cs"
            echo "=================== $u"
            curl -sSL -m 40 -A "Mozilla/5.0" "$u" | python3 -c "
          import sys, html.parser, re
          class P(html.parser.HTMLParser):
              def __init__(s): super().__init__(); s.t=[]; s.skip=0
              def handle_starttag(s,tag,a):
                  if tag in ('script','style','nav','header','footer'): s.skip+=1
                  if tag in ('p','li','h1','h2','h3','h4','br','tr'): s.t.append('\n')
              def handle_endtag(s,tag):
                  if tag in ('script','style','nav','header','footer'): s.skip-=1
              def handle_data(s,d):
                  if s.skip<=0: s.t.append(d)
          p=P(); p.feed(sys.stdin.read()); t=re.sub(r'\n\s*\n+','\n',''.join(p.t)); print(t[:9000])
          "
          done
